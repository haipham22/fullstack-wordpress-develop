services:
  wordpress:
    # image: docker.io/bitpoke/wordpress-runtime:bedrock-php-8.3.14
    # image: ghcr.io/haipham22/fullstack-wordpress-develop
    build: .
    # environment:
    #   - VIRTUAL_HOST=wp.dev.com
    #   - VIRTUAL_PORT=8080
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    volumes:
      # - ./docker/nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf
      - ./:/app
      - ./docker/supervisord.conf:/etc/supervisor/conf.d/supervisord.conf
    ports:
      - "8080:8080"
    restart: always
    depends_on:
      db:
        condition: service_healthy
    # ponytail: runtime composer install vì volume ./:/app che vendor build sẵn; bỏ volume này thì vendor nằm trong image, khỏi cần command
    command:
      - sh
      - -c
      - |
        composer install --no-interaction --no-dev --optimize-autoloader && \
        exec supervisord -c /etc/supervisor/conf.d/supervisord.conf
    # env_file:
    #   - .env

  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - db-data:/var/lib/mysql
    # ports:
    #   - "3306:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: always

volumes:
  db-data:

name: Auto Update WordPress Core, Plugins and Themes (Weekly)

on:
  schedule:
    - cron: '0 3 * * 1' # every Monday at 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      - name: Update dependencies
        run: composer update --no-interaction --no-progress

      # ponytail: nhánh/commit/PR đều do action này tự tạo; chạy lại sẽ cập nhật PR cũ thay vì fail
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "🔄 Weekly WordPress dependency update"
          title: "🔄 Weekly WordPress dependency update"
          body: |
            Automated weekly update of WordPress core, plugins and themes via `composer update`.
          branch: auto/update-dependencies
          labels: |
            dependencies

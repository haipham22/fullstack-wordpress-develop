name: Install WP Plugin or Theme via WPackagist

on:
  workflow_dispatch:
    inputs:
      wp_url:
        description: 'WordPress.org plugin or theme URL'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  install:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      - name: Parse URL
        id: parse
        run: |
          URL="${{ github.event.inputs.wp_url }}"
          SLUG=$(basename "${URL%/}")

          if echo "$URL" | grep -q "/plugins/"; then
            TYPE=plugin
          elif echo "$URL" | grep -q "/themes/"; then
            TYPE=theme
          else
            echo "::error::URL phải là wordpress.org/plugins/... hoặc /themes/..."
            exit 1
          fi

          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          echo "type=$TYPE" >> "$GITHUB_OUTPUT"

      - name: Install package
        run: composer require "wpackagist-${{ steps.parse.outputs.type }}/${{ steps.parse.outputs.slug }}" --no-interaction --no-progress

      # ponytail: tạo PR theo convention add/{slug} như PR #6; muốn commit thẳng main thì thay bằng git push origin main
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Add ${{ steps.parse.outputs.type }}: ${{ steps.parse.outputs.slug }}"
          title: "Add ${{ steps.parse.outputs.type }}: ${{ steps.parse.outputs.slug }}"
          body: "Install via WPackagist: ${{ github.event.inputs.wp_url }}"
          branch: add/${{ steps.parse.outputs.slug }}
          labels: dependencies
